resources:
  pipelines:
    sunny_bay_roastery_pipeline:
      name: sunny_bay_roastery
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      root_path: "."
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        gold_schema: ${var.gold_schema}
        volume: ${var.volume}
      libraries:
        - glob:
            include: ../src/transformations/**
