# Setup job: generate the source files, run the pipeline, deploy metadata, metric view and Genie.

resources:
  jobs:
    sunny_bay_roastery_job:
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: prefix
          default: ${var.prefix}
        - name: warehouse_id
          default: ${var.warehouse_id}

      name: "Sunny Bay Roastery Job"
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../src/notebooks/generate_data.ipynb
        - task_key: run_pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.sunny_bay_roastery_pipeline.id}
            # The source files are regenerated on every run (rolling 24-month window),
            # so the streaming tables are rebuilt from scratch instead of appending.
            full_refresh: true
        - task_key: deploy_metadata
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../src/notebooks/deploy_metadata.ipynb
        - task_key: deploy_metric_view
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../src/notebooks/deploy_metric_view.ipynb
        - task_key: deploy_genie_space
          depends_on:
            - task_key: deploy_metric_view
          notebook_task:
            notebook_path: ../src/notebooks/deploy_genie_space.ipynb
