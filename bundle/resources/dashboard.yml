resources:
  dashboards:
    # NOTE: the "[Template]" dashboard is intentionally NOT deployed here.
    # A bundle-managed dashboard is read-only in the UI (no Edit button), so
    # participants cannot build on it. Instead, Lab 0 creates an *editable*
    # (unmanaged) copy of dashboard_template.lvdash.json in each participant's
    # own workspace. Only the read-only "[Final]" answer key is bundle-managed.
    sunny_bay_roastery_dashboard_final:
      display_name: "[Final] Sunny Bay Roastery - Sales Report"
      file_path: ../src/dashboards/dashboard_final.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.gold_schema}


