name: Release on merge to main

# Fires on every push to main (i.e. when a PR is merged). Cuts the next
# release: a release/X.Y.Z branch, a vX.Y.Z tag, and a GitHub Release.
#
# Triggering on push (not pull_request) means the workflow runs from the
# just-merged commit, so it also releases the PR that introduces this file.
# The bump size comes from the merged PR's label (major / minor / patch),
# looked up from the merge commit; with no label it defaults to a patch bump.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Labels of the PR this merge commit came from (empty for direct pushes).
          labels=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
                     -H "Accept: application/vnd.github+json" \
                     --jq '.[].labels[].name' 2>/dev/null | tr '\n' ' ' || true)
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case " $labels " in
            *" major "*) major=$((major+1)); minor=0; patch=0 ;;
            *" minor "*) minor=$((minor+1)); patch=0 ;;
            *)           patch=$((patch+1)) ;;
          esac
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Labels: [$labels] | previous: ${latest} -> next: v${major}.${minor}.${patch}"

      - name: Cut release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          BRANCH: ${{ steps.ver.outputs.branch }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git branch "$BRANCH"
          git push origin "$BRANCH"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --target "$TAG" --generate-notes --title "$TAG"
